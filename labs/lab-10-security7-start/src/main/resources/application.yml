spring:
  application:
    name: library-lab
  datasource:
    # The lab rig's engine, the default: an H2 in memory, created fresh at
    # every boot and shaped by the migration before anything reads it. One
    # configuration, two engines: point this url at a PostgreSQL and the same
    # migration is taken there unchanged.
    url: jdbc:h2:mem:library
    username: sa
  jpa:
    hibernate:
      # The schema belongs to the migration, not to Hibernate: Flyway
      # creates, Hibernate validates. Anything looser - update, create-drop -
      # would let Hibernate guess a table it was never told about.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  http:
    clients:
      # A service that does not answer is a failure, not a hang. These are
      # Boot 4's deadlines for the shared RestClient.Builder, so the
      # availability client inherits them: a call that outlives its read
      # timeout fails loudly instead of holding a request thread forever.
      connect-timeout: 1s
      read-timeout: 2s

management:
  server:
    # The management surface is a different socket from the public API's:
    # with this line the main context serves no actuator path at all - a
    # request for /actuator/health on the API's port earns the 404 any
    # unknown path earns - and the two ports the processes now own separate
    # what a monitor may reach from what a stranger's ingress reaches. Zero
    # asks the environment for the management port the way the rest of this
    # lab's socket numbers are asked for; a deployment that must pin the
    # number for its monitor overwrites exactly this line.
    port: 0
  endpoints:
    web:
      exposure:
        # One step past the starter's default (health): metrics, the cheap
        # honest read the dashboards make while no exporter is wired - the
        # diagnostics read library.loans.issued there exactly the way a
        # dashboard would. Everything else stays unexposed on the web: an
        # include=* line would hand env, configprops, heapdump, threaddump
        # and httpexchanges to anyone who reaches the management port.
        include: "health,metrics"

library:
  availability:
    # Where the availability service lives. The diagnostics hand the
    # application a WireMock server's URL instead.
    base-url: http://localhost:9999
  loan:
    # How long a loan lasts. The application.yml is where a default belongs:
    # it is visible to whoever deploys it, and it can be changed without a
    # rebuild.
    period: 14d
    # How many loans a member may hold at once.
    limit: 3
